services:
  mysql-a:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${SILO_TEST_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: silo_a_test
      MYSQL_USER: ${SILO_TEST_USER:?required}
      MYSQL_PASSWORD: ${SILO_TEST_PASSWORD:?required}
    ports:
      - "127.0.0.1::3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent
      interval: 3s
      timeout: 3s
      retries: 40

  mysql-b:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${SILO_TEST_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: silo_b_test
      MYSQL_USER: ${SILO_TEST_USER:?required}
      MYSQL_PASSWORD: ${SILO_TEST_PASSWORD:?required}
    ports:
      - "127.0.0.1::3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent
      interval: 3s
      timeout: 3s
      retries: 40
